[package]
name = "folio"
version = "0.3.10"
description = "A native Markdown library reader and editor"
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# Watches the open library so changes made outside Folio — a sync landing, an
# editor saving over a page — appear on their own rather than behind Refresh.
notify = "8"
serde = { version = "1", features = ["derive"] }
# Deletes go to the Finder trash rather than unlinking, so they stay undoable.
trash = "5"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

