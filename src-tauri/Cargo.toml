[package]
name = "folio"
version = "0.3.9"
description = "A native Markdown library reader and editor"
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# Keeps canonical paths in the plain `C:\…` form on Windows rather than the
# verbatim `\\?\C:\…` one. A no-op passthrough on macOS.
dunce = "1"
serde = { version = "1", features = ["derive"] }
# Deletes go to the system trash rather than unlinking, so they stay undoable:
# the Finder trash on macOS, the Recycle Bin on Windows.
trash = "5"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

