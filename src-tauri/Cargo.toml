[package]
name = "folio"
version = "0.4.3"
description = "A native Markdown library reader and editor"
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# Keeps canonical paths in the plain `C:\…` form on Windows rather than the
# verbatim `\\?\C:\…` one. A no-op passthrough on macOS.
dunce = "1"
# Watches the open library so changes made outside Folio — a sync landing, an
# editor saving over a page — appear on their own rather than behind Refresh.
notify = "8"
# Git-backed sync: the library folder is the repository, committed and merged
# through libgit2 so no git binary is required on the machine.
#
# The features are not optional and not defaults: as of 0.21 git2 ships with
# none, which builds a libgit2 that cannot speak https or ssh at all. https
# rides the platform's TLS — SecureTransport on macOS, WinHTTP on Windows —
# but ssh brings in libssh2, whose crypto is OpenSSL on macOS. vendored-openssl
# builds that OpenSSL in and links it statically: linked dynamically it binds
# to Homebrew's copy, which exists only on machines that installed it and is
# rejected by the hardened runtime everywhere, so the app dies at launch.
# On Windows libssh2 uses WinCNG and no OpenSSL enters the build at all.
git2 = { version = "0.21", features = ["https", "ssh", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
# Deletes go to the system trash rather than unlinking, so they stay undoable:
# the Finder trash on macOS, the Recycle Bin on Windows.
trash = "5"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

