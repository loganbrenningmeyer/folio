name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # windows-latest already carries the MSVC build tools Tauri links against,
      # so the default host target is the one to build.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Builds the renderer (tauri beforeBuildCommand) and the installer.
      # Output: src-tauri/target/release/bundle/nsis/Folio_<version>_x64-setup.exe
      #
      # The installer downloads the WebView2 runtime when the machine does not
      # already have it, which is why no runtime is vendored here.
      - name: Build installer
        run: npm run desktop:exe

      - name: Collect installer
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $src) {
            Write-Error "No NSIS installer produced"
            exit 1
          }
          Copy-Item $src.FullName "release/Folio-$tag-setup.exe"
          Get-ChildItem release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-installer
          path: release/*.exe

      # This job and the macOS one race for the same release, so whichever
      # arrives first creates it and both then upload into it.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release/*.exe --clobber
