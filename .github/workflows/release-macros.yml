name: Build macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Builds the renderer (tauri beforeBuildCommand) and the DMG.
      # Output: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Folio_<version>_universal.dmg
      - name: Build DMG
        run: npm run desktop:dmg -- --target universal-apple-darwin

      - name: Collect DMG
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          mkdir -p release
          SRC=$(find src-tauri/target -name "*.dmg" -print -quit)
          if [ -z "$SRC" ]; then
            echo "No .dmg produced" >&2
            exit 1
          fi
          cp "$SRC" "release/Folio-${TAG}.dmg"
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-dmg
          path: release/*.dmg

      # This job and the Windows one race for the same release, so whichever
      # arrives first creates it and both then upload into it.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release/*.dmg --clobber
